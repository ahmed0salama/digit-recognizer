<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwritten digit ML model recognizer</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #121212;
            color: #f1f1f1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            box-sizing: border-box;
        }
        .page-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .page-title {
            font-size: 1.85rem;
            font-weight: 700;
            color: #f8fafc;
            margin: 0 0 0.35rem 0;
            letter-spacing: -0.02em;
        }
        .page-subtitle {
            font-size: 0.95rem;
            color: #9ca3af;
            margin: 0;
        }
        .container {
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            max-width: 720px;
            width: 100%;
            box-sizing: border-box;
        }
        .canvas-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            border: 2px solid #444;
            border-radius: 8px;
            background: #000000;
            cursor: crosshair;
            touch-action: none;
        }
        .controls {
            margin-top: 1rem;
            display: flex;
            width: 100%;
        }
        button {
            width: 100%;
            padding: 0.65rem 1rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-clear { background: #374151; color: #e5e7eb; }
        .btn-clear:hover { background: #4b5563; }
        .results-section {
            flex: 1;
            min-width: 240px;
        }
        .prediction-box {
            background: #262626;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 1rem;
        }
        .digit-display {
            font-size: 3.5rem;
            font-weight: 700;
            color: #60a5fa;
            line-height: 1.1;
        }
        .bar-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.35rem;
            font-size: 0.85rem;
            color: #9ca3af;
            transition: color 0.2s ease;
        }
        .bar-row.top-choice {
            color: #f8fafc;
            font-weight: 600;
        }
        .bar-track {
            flex: 1;
            background: #2d2d2d;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: #3b82f6;
            width: 0%;
            border-radius: 5px;
            transition: width 0.28s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.2s ease;
            will-change: width;
        }
        .bar-row.top-choice .bar-fill {
            background: #60a5fa;
            box-shadow: 0 0 8px rgba(96, 165, 250, 0.5);
        }
        .page-footer {
            margin-top: 1.35rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.65rem;
            font-size: 0.92rem;
            color: #9ca3af;
            text-align: center;
        }
        .author-name {
            color: #60a5fa;
            font-weight: 600;
        }
        .social-links {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .social-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.45rem 0.9rem;
            border-radius: 6px;
            background: #1e1e1e;
            border: 1px solid #333;
            color: #e5e7eb;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }
        .social-btn:hover {
            background: #262626;
            border-color: #60a5fa;
            color: #ffffff;
        }
        .social-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <header class="page-header">
        <h1 class="page-title">Handwritten digit ML model recognizer</h1>
        <p class="page-subtitle">Real-time neural network inference (0–9)</p>
    </header>

    <div class="container">
        <div class="canvas-section">
            <canvas id="drawCanvas" width="280" height="280"></canvas>
            <div class="controls">
                <button class="btn-clear" onclick="clearCanvas()">Clear</button>
            </div>
        </div>

        <div class="results-section">
            <div class="prediction-box">
                <div>Predicted Digit</div>
                <div class="digit-display" id="predictedDigit">-</div>
                <div id="confidenceText">Loading model...</div>
            </div>
            <div id="barsContainer"></div>
        </div>
    </div>

    <footer class="page-footer">
        <div>Developed by <span class="author-name">Ahmed Salama</span></div>
        <div class="social-links">
            <a class="social-btn" href="https://www.linkedin.com/in/ahmed-salama-0960731b6" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19 3A2 2 0 0 1 21 5V19A2 2 0 0 1 19 21H5A2 2 0 0 1 3 19V5A2 2 0 0 1 5 3H19M18.5 18.5V13.2A3.26 3.26 0 0 0 15.24 9.94C14.39 9.94 13.4 10.46 12.92 11.24V10.13H10.13V18.5H12.92V13.57C12.92 12.8 13.54 12.17 14.31 12.17A1.4 1.4 0 0 1 15.71 13.57V18.5H18.5M6.88 8.56A1.68 1.68 0 0 0 8.56 6.88C8.56 5.95 7.81 5.19 6.88 5.19A1.69 1.69 0 0 0 5.19 6.88C5.19 7.81 5.95 8.56 6.88 8.56M8.27 18.5V10.13H5.5V18.5H8.27Z"/>
                </svg>
                LinkedIn
            </a>
            <a class="social-btn" href="https://github.com/ahmed0salama/digit-recognizer" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
                </svg>
                GitHub Repo
            </a>
        </div>
    </footer>

    <script>
        const canvas = document.getElementById("drawCanvas");
        const ctx = canvas.getContext("2d");

        // Offscreen 28x28 canvas for downsampling
        const smallCanvas = document.createElement("canvas");
        smallCanvas.width = 28;
        smallCanvas.height = 28;
        const smallCtx = smallCanvas.getContext("2d");

        let weights = null;
        let isDrawing = false;
        let hasStrokes = false;

        const barRows = [];
        const barFills = [];
        const barTexts = [];

        function buildBarsOnce() {
            const container = document.getElementById("barsContainer");
            container.innerHTML = "";
            for (let idx = 0; idx < 10; idx++) {
                const row = document.createElement("div");
                row.className = "bar-row";
                row.innerHTML = `
                    <span style="width: 14px;">${idx}</span>
                    <div class="bar-track">
                        <div class="bar-fill" style="width: 0%;"></div>
                    </div>
                    <span class="bar-pct" style="width: 48px; text-align: right;">0.0%</span>
                `;
                container.appendChild(row);
                barRows.push(row);
                barFills.push(row.querySelector(".bar-fill"));
                barTexts.push(row.querySelector(".bar-pct"));
            }
        }

        function updateBars(probs, topDigit = -1) {
            for (let idx = 0; idx < 10; idx++) {
                const p = probs[idx] || 0;
                barFills[idx].style.width = `${p}%`;
                barTexts[idx].textContent = `${p.toFixed(1)}%`;
                barRows[idx].classList.toggle("top-choice", idx === topDigit && p > 0);
            }
        }

        function initCanvas() {
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#FFFFFF";
            ctx.lineWidth = 22;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
        }

        function denseLayer(input, W, b, applyRelu) {
            const outDim = b.length;
            const out = new Float32Array(outDim);
            for (let j = 0; j < outDim; j++) {
                let sum = b[j];
                for (let i = 0; i < input.length; i++) {
                    sum += input[i] * W[i][j];
                }
                out[j] = applyRelu ? Math.max(0, sum) : sum;
            }
            return out;
        }

        function softmax(logits) {
            const maxLogit = Math.max(...logits);
            const exps = logits.map(v => Math.exp(v - maxLogit));
            const sumExp = exps.reduce((a, b) => a + b, 0);
            return exps.map(e => (e / sumExp) * 100);
        }

        function isValidDigitShape(pixels) {
            let activePixels = 0;
            let minX = 28, maxX = -1, minY = 28, maxY = -1;

            for (let y = 0; y < 28; y++) {
                for (let x = 0; x < 28; x++) {
                    if (pixels[y * 28 + x] > 0.2) {
                        activePixels++;
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }

            if (activePixels < 12) return false;
            if (activePixels / 784 > 0.36) return false;

            const bboxW = maxX - minX + 1;
            const bboxH = maxY - minY + 1;
            const bboxFill = activePixels / Math.max(bboxW * bboxH, 1);
            if (bboxW > 6 && bboxFill > 0.70) return false;

            return true;
        }

        function predictLive() {
            if (!weights || !hasStrokes) return;

            // Downsample 280x280 -> 28x28
            smallCtx.imageSmoothingEnabled = true;
            smallCtx.imageSmoothingQuality = "high";
            smallCtx.drawImage(canvas, 0, 0, 28, 28);
            const imgData = smallCtx.getImageData(0, 0, 28, 28).data;

            const input = new Float32Array(784);
            for (let i = 0; i < 784; i++) {
                input[i] = imgData[i * 4] / 255.0; // Red channel (grayscale)
            }

            if (!isValidDigitShape(input)) {
                document.getElementById("predictedDigit").textContent = "-";
                document.getElementById("confidenceText").textContent = "Not a recognized digit";
                updateBars(new Array(10).fill(0), -1);
                return;
            }

            // Forward pass: L1 (784->256 ReLU) -> L2 (256->128 ReLU) -> L3 (128->10 Softmax)
            const h1 = denseLayer(input, weights.L1.W, weights.L1.b, true);
            const h2 = denseLayer(h1, weights.L2.W, weights.L2.b, true);
            const logits = denseLayer(h2, weights.L3.W, weights.L3.b, false);
            const probs = softmax(Array.from(logits));

            let bestDigit = 0;
            for (let i = 1; i < 10; i++) {
                if (probs[i] > probs[bestDigit]) bestDigit = i;
            }
            const confidence = probs[bestDigit];

            if (confidence < 65.0) {
                document.getElementById("predictedDigit").textContent = "-";
                document.getElementById("confidenceText").textContent = "Not a recognized digit";
                updateBars(new Array(10).fill(0), -1);
                return;
            }

            document.getElementById("predictedDigit").textContent = bestDigit;
            document.getElementById("confidenceText").textContent = `Confidence: ${confidence.toFixed(2)}%`;
            updateBars(probs, bestDigit);
        }

        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startDraw(e) {
            isDrawing = true;
            hasStrokes = true;
            const { x, y } = getCoords(e);
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y);
            ctx.stroke();
            predictLive();
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const { x, y } = getCoords(e);
            ctx.lineTo(x, y);
            ctx.stroke();
            predictLive();
        }

        function stopDraw() {
            if (!isDrawing) return;
            isDrawing = false;
            predictLive();
        }

        canvas.addEventListener("mousedown", startDraw);
        canvas.addEventListener("mousemove", draw);
        canvas.addEventListener("mouseup", stopDraw);
        canvas.addEventListener("mouseout", stopDraw);

        canvas.addEventListener("touchstart", startDraw);
        canvas.addEventListener("touchmove", draw);
        canvas.addEventListener("touchend", stopDraw);

        function clearCanvas() {
            hasStrokes = false;
            initCanvas();
            document.getElementById("predictedDigit").textContent = "-";
            document.getElementById("confidenceText").textContent = "Draw a digit (0–9)";
            updateBars(new Array(10).fill(0), -1);
        }

        async function loadModelWeights() {
            try {
                const res = await fetch("./weights.json");
                weights = await res.json();
                document.getElementById("confidenceText").textContent = "Draw a digit (0–9)";
            } catch (err) {
                document.getElementById("confidenceText").textContent = "Error loading weights.json";
                console.error(err);
            }
        }

        buildBarsOnce();
        initCanvas();
        loadModelWeights();
    </script>
</body>
</html>
